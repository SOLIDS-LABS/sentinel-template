<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL Operations Centre</title>
<meta name="description" content="The live operations view for ECE 476 SENTINEL.">
<link rel="stylesheet" href="css/sentinel.css">
</head>
<body>

<noscript>
  <div style="padding:24px;font:14px system-ui">
    <h1 style="margin:0 0 8px">SENTINEL</h1>
    <p>This page needs JavaScript. The files it reads are plain text, and you can
       read them without this page:</p>
    <ul>
      <li><code>web/live/missions.log</code> — the mission log</li>
      <li><code>web/live/feed.txt</code> — the contact reports</li>
    </ul>
  </div>
</noscript>

<script>
(function () {
  function show(what, detail) {
    var box = document.getElementById("boot-error");
    if (!box) {
      box = document.createElement("pre");
      box.id = "boot-error";
      box.style.cssText =
        "margin:0;padding:16px 20px;background:#fbeaea;color:#7d1d1d;" +
        "font:12.5px ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;" +
        "border-bottom:2px solid #c02b2b";
      document.body.insertBefore(box, document.body.firstChild);
    }
    box.textContent += what + ": " + detail + "\n";
  }
  window.addEventListener("error", function (e) {
    show("error", (e.message || e.error) + "  (" + (e.filename || "") + ":" + (e.lineno || 0) + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    show("failed", (r && (r.stack || r.message)) || String(r));
  });
})();
</script>

<script type="module" src="js/app.js"></script>

</body>
</html>
